name: Release Binaries

on:
  release:
    types: [published]
  # fork 里 push 事件触发不了工作流, 手动入口用来直接发正式版
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的正式版本号, 例如 1.5.1"
        required: true
        type: string
      target:
        description: "打标签的提交或分支"
        required: false
        default: main
        type: string

permissions:
  contents: write

jobs:
  prepare:
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Resolve release tag
        id: resolve
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="$DISPATCH_TAG"
          else
            VERSION="$RELEASE_TAG"
          fi
          if [ -z "$VERSION" ]; then
            echo "No release tag resolved"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Release tag: ${VERSION}"

      - name: Create release
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.resolve.outputs.version }}
          TARGET: ${{ inputs.target }}
        run: |
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $VERSION already exists, reusing it."
            exit 0
          fi
          gh release create "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "${TARGET:-main}" \
            --title "$VERSION" \
            --generate-notes

  build-and-attach:
    needs: prepare
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        exclude:
          - goos: windows
            goarch: arm
          - goos: darwin
            goarch: 386
          - goos: darwin
            goarch: arm
        include:
          - goos: linux
            goarch: loong64
          - goos: linux
            goarch: riscv64
          - goos: linux
            goarch: s390x
          - goos: linux
            goarch: ppc64
          - goos: linux
            goarch: ppc64le
          - goos: linux
            goarch: mips
          - goos: linux
            goarch: mipsle
          - goos: linux
            goarch: mips64
          - goos: linux
            goarch: mips64le
        goos: [windows, linux, darwin, freebsd]
        goarch: [amd64, arm64, 386, arm]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # 按 tag 构建, 而不是触发工作流时的分支: 手动重跑老版本 (比如 1.5.10)
          # 时, 否则会拿当前 main 的代码编出来, 再用 --clobber 覆盖掉那个版本的产物
          ref: refs/tags/${{ needs.prepare.outputs.version }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          BINARY_NAME=komari-agent-${{ matrix.goos }}-${{ matrix.goarch }}
          if [ "${{ matrix.goos }}" = "windows" ]; then
            BINARY_NAME=${BINARY_NAME}.exe
          elif [ "${{ matrix.goos }}" = "darwin" ]; then
            # macOS binaries typically do not have a file extension
            true
          fi
            go build -trimpath -ldflags="-s -w -X github.com/komari-monitor/komari-agent/update.CurrentVersion=${VERSION}" -o $BINARY_NAME

      - name: Build switcher
        if: ${{ matrix.goos != 'windows' }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          # 文件名必须以 .bin 结尾: 1.5.10 及更早的 agent 用 go-github-selfupdate 自更新,
          # 它挑 release 里第一个以 <os>-<arch> 结尾的文件, 不加后缀的话
          # komari-switch-linux-amd64 会和 komari-agent-linux-amd64 撞上,
          # 顺序一变, 旧 agent 就会把自己换成切换器然后起不来。
          # 加入切换器之前打的 tag 里没有这个目录, 重跑那些版本时跳过
          [ -d switcher ] || { echo "no switcher in this tag, skipping"; exit 0; }
          go build -trimpath -ldflags="-s -w -X main.buildVersion=${VERSION}" \
            -o komari-switch-${{ matrix.goos }}-${{ matrix.goarch }}.bin ./switcher

      - name: Upload binary to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BINARY_NAME=komari-agent-${{ matrix.goos }}-${{ matrix.goarch }}
          if [ "${{ matrix.goos }}" = "windows" ]; then
            BINARY_NAME=${BINARY_NAME}.exe
          elif [ "${{ matrix.goos }}" = "darwin" ]; then
            true
          fi
          SWITCH_NAME=komari-switch-${{ matrix.goos }}-${{ matrix.goarch }}.bin
          [ -f "$SWITCH_NAME" ] || SWITCH_NAME=""
          # 1.5.10 及更早的 agent (go-github-selfupdate) 会把 release 里第一个以
          # <os>[-_]<arch>[扩展名] 结尾的文件当成自己的新版本。除 agent 本体外,
          # 任何撞上这条规则的产物都可能被旧 agent 下载成自己, 发布前拦住。
          for f in $SWITCH_NAME; do
            for sep in - _; do
              for ext in "" .zip .tar.gz .tgz .gzip .gz .tar.xz .xz; do
                case "$f" in
                  *"${{ matrix.goos }}${sep}${{ matrix.goarch }}${ext}")
                    echo "::error::$f would be picked up by old agents as their own update"
                    exit 1 ;;
                esac
              done
            done
          done
          # --clobber: 同一个 tag 重跑一次时直接覆盖同名产物,
          # 否则 gh 会报 "asset under the same name already exists" 然后整个矩阵挂掉
          gh release upload ${{ needs.prepare.outputs.version }} $BINARY_NAME $SWITCH_NAME \
            --clobber --repo ${{ github.repository }}
        shell: bash
