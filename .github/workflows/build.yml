name: Build on Main

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        exclude:
          - goos: windows
            goarch: arm
          - goos: darwin
            goarch: 386
          - goos: darwin
            goarch: arm
        include:
          - goos: linux
            goarch: loong64
          - goos: linux
            goarch: riscv64
          - goos: linux
            goarch: s390x
          - goos: linux
            goarch: ppc64
          - goos: linux
            goarch: ppc64le
          - goos: linux
            goarch: mips
          - goos: linux
            goarch: mipsle
          - goos: linux
            goarch: mips64
          - goos: linux
            goarch: mips64le
        goos: [windows, linux, darwin, freebsd]
        goarch: [amd64, arm64, 386, arm]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # garble 只认它自己被编译时用的 Go 版本，要和下面装的 garble 配套，见 release-build.sh
          go-version: "1.27.4"

      - name: Install garble
        run: go install mvdan.cc/garble@v0.18.0

      - name: Build binary
        env:
          VERSION: ${{ github.sha }}
        run: |
          BINARY_NAME=komari-agent-${{ matrix.goos }}-${{ matrix.goarch }}
          if [ "${{ matrix.goos }}" = "windows" ]; then
            BINARY_NAME=${BINARY_NAME}.exe
          fi
          sh release-build.sh ${{ matrix.goos }} ${{ matrix.goarch }} "$VERSION" "$BINARY_NAME"

      - name: Build switcher
        if: ${{ matrix.goos != 'windows' }}
        env:
          VERSION: ${{ github.sha }}
        run: |
          # 文件名必须以 .bin 结尾: 1.5.10 及更早的 agent 用 go-github-selfupdate 自更新,
          # 它挑 release 里第一个以 <os>-<arch> 结尾的文件, 不加后缀的话
          # komari-switch-linux-amd64 会和 komari-agent-linux-amd64 撞上,
          # 顺序一变, 旧 agent 就会把自己换成切换器然后起不来。
          sh release-build.sh ${{ matrix.goos }} ${{ matrix.goarch }} "$VERSION" \
            komari-switch-${{ matrix.goos }}-${{ matrix.goarch }}.bin switcher

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: komari-agent-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            komari-agent-${{ matrix.goos }}-${{ matrix.goarch }}*
            komari-switch-${{ matrix.goos }}-${{ matrix.goarch }}*
