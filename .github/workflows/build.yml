name: Build on Main

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 只混淆本模块的包。garble 只认它编译时用的 Go，所以 Go 版本固定，和装的 garble 配套
      GOGARBLE: github.com/komari-monitor/komari-agent,github.com/komari-monitor/komari-agent/*
    strategy:
      fail-fast: false
      matrix:
        exclude:
          - goos: windows
            goarch: arm
          - goos: darwin
            goarch: 386
          - goos: darwin
            goarch: arm
        include:
          - goos: linux
            goarch: loong64
          - goos: linux
            goarch: riscv64
          - goos: linux
            goarch: s390x
          - goos: linux
            goarch: ppc64
          - goos: linux
            goarch: ppc64le
          - goos: linux
            goarch: mips
          - goos: linux
            goarch: mipsle
          - goos: linux
            goarch: mips64
          - goos: linux
            goarch: mips64le
        goos: [windows, linux, darwin, freebsd]
        goarch: [amd64, arm64, 386, arm]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.4"

      - name: Install garble
        run: go install mvdan.cc/garble@v0.18.0

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
          VERSION: ${{ github.sha }}
        run: |
          BINARY_NAME=komari-agent-${{ matrix.goos }}-${{ matrix.goarch }}
          if [ "${{ matrix.goos }}" = "windows" ]; then
            BINARY_NAME=${BINARY_NAME}.exe
          fi
          garble -literals -tiny build -trimpath -ldflags="-s -w -X github.com/komari-monitor/komari-agent/update.CurrentVersion=${VERSION}" -o $BINARY_NAME

      - name: Build switcher
        if: ${{ matrix.goos != 'windows' }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
          VERSION: ${{ github.sha }}
        run: |
          # 文件名必须以 .bin 结尾: 1.5.10 及更早的 agent 用 go-github-selfupdate 自更新,
          # 它挑 release 里第一个以 <os>-<arch> 结尾的文件, 不加后缀的话
          # komari-switch-linux-amd64 会和 komari-agent-linux-amd64 撞上,
          # 顺序一变, 旧 agent 就会把自己换成切换器然后起不来。
          garble -literals -tiny build -trimpath -ldflags="-s -w -X main.buildVersion=${VERSION}" \
            -o komari-switch-${{ matrix.goos }}-${{ matrix.goarch }}.bin ./switcher

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: komari-agent-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            komari-agent-${{ matrix.goos }}-${{ matrix.goarch }}*
            komari-switch-${{ matrix.goos }}-${{ matrix.goarch }}*

  # Windows 7 / Server 2008 R2 / 2012 只能跑打过补丁的 Go 1.24 产物，见 legacy-windows/README.md
  build-legacy-windows:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, 386]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up stock Go 1.24.13
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.13"

      - name: Cache patched toolchain
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: ~/go-legacy
          key: legacy-toolchain-go1.24.13-${{ hashFiles('legacy-windows/patch.py', 'legacy-windows/toolchain.sh') }}

      - name: Build patched toolchain
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: bash legacy-windows/toolchain.sh "$(go env GOROOT)" "$HOME/go-legacy"

      - name: Build binary
        env:
          VERSION: ${{ github.sha }}
        run: |
          bash legacy-windows/build.sh "$HOME/go-legacy" \
            "komari-agent-windows-${{ matrix.goarch }}-legacy.exe" "${{ matrix.goarch }}" "${VERSION}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: komari-agent-windows-${{ matrix.goarch }}-legacy
          path: komari-agent-windows-${{ matrix.goarch }}-legacy.exe
