name: Fix switcher asset names

# 一次性修复: 早期 release 里的切换器叫 komari-switch-<os>-<arch>,
# 1.5.10 及更早的 agent 自更新时按 "<os>-<arch> 结尾" 挑文件, 可能把它错当成
# 自己下载下来。这里把已发布的这些文件统一改名为 .bin。可以重复运行。
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - name: Rename stale switcher assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          stale='.[] | .id as $rid | .tag_name as $tag | .assets[]
                 | select(.name | startswith("komari-switch-"))
                 | select(.name | endswith(".bin") | not)
                 | "\($rid) \($tag) \(.id) \(.name)"'

          gh api --paginate "repos/$REPO/releases?per_page=100" --jq "$stale" |
          while read -r rid tag id name; do
            target="${name}.bin"
            if gh api --paginate "repos/$REPO/releases/$rid/assets?per_page=100" --jq '.[].name' | grep -qx "$target"; then
              # 这个 release 里已经有 .bin 版本了, 旧名字那个直接删
              echo "$tag: $target already present, deleting stale $name"
              gh api -X DELETE "repos/$REPO/releases/assets/$id" || echo "::warning::failed to delete $tag/$name"
            else
              echo "$tag: $name -> $target"
              gh api -X PATCH "repos/$REPO/releases/assets/$id" -f name="$target" >/dev/null \
                || echo "::warning::failed to rename $tag/$name"
            fi
          done

          echo "--- switcher assets still without .bin:"
          left=$(gh api --paginate "repos/$REPO/releases?per_page=100" --jq "$stale")
          if [ -n "$left" ]; then
            echo "$left"
            exit 1
          fi
          echo "(none)"
